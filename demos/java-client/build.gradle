// SPDX-License-Identifier: Apache-2.0
//
// Stubs are generated from ../../proto at build time. Nothing generated is
// checked in, so the contract in the repository is the only source of truth
// and this client cannot drift from it without failing to build.

plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
}

repositories {
    mavenCentral()
}

// Pinned together: protoc generates the message classes that protobuf-java
// reads, and grpc-java's protoc plugin has to match the runtime it generates
// against.
ext {
    grpcVersion = '1.84.0'
    protobufVersion = '4.36.1'
}

dependencies {
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    // Supplies @Generated to the grpc-java generated code, which needs it at
    // compile time and never at run time.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // The test runs the demo against an in-process server that never
    // answers, to hold it to its deadlines.
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

sourceSets {
    main {
        proto {
            // Replaces the default src/main/proto rather than adding to it:
            // there is no second place protos may come from.
            srcDirs = ['../../proto']
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

application {
    mainClass = 'demo.LolHtmlDemo'
}

// `--release 17` rather than a toolchain, so the build uses whatever JDK is on
// hand instead of provisioning a second one. It still refuses APIs newer than
// 17, which is the part that matters for a demo claiming to run on 17.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

// The demo writes its event feed to stdout and is diffed against the Node and
// Python clients byte for byte, so Gradle's own chatter has to stay out of it.
// `--console=plain -q` handles the rest.
run {
    outputs.upToDateWhen { false }
}

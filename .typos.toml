[default.extend-words]
# Protobuf field/type shorthand mirrored from calamine's public API.
typ = "typ"
# "caf&eacute;" in demos/sample-data/entities.html is an entity-decoding fixture.
caf = "caf"

[files]
# Generated code is not hand-written prose. The entity fixture splits words
# around HTML entities on purpose (`caf&eacute;`), which is what it tests.
extend-exclude = ["src/gen/**", "demos/sample-data/entities.html"]

name: Publish Images

# Builds the service and viewer images and pushes them to
# docker.io/pipestreamai. Every push to master republishes :latest; a manual
# dispatch with a version input also tags that version. Docker Hub
# credentials come from the DOCKER_USER / DOCKER_TOKEN org secrets.
#
# Multi-arch (amd64 + arm64): the runtime base (dhi.io/debian-base) and the
# viewer base (dhi.io/node) are both published for the two platforms, and
# the Rust build runs under QEMU for the arm64 leg.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra version tag (for example 0.1.0); optional'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # The version reaches the script through the environment, never through
      # `${{ }}` interpolation into it: an interpolated input is pasted into
      # the script before the shell parses it, so a crafted value runs as
      # code in a job holding the Docker Hub token. It is then held to a
      # semantic version that is also a valid image tag (no `+` build
      # metadata) before it goes anywhere near a tag list.
      - name: Compute tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          svc="docker.io/pipestreamai/grpc-lol-html:latest"
          ui="docker.io/pipestreamai/grpc-lol-html-ui:latest"
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]{0,63})?$ ]]; then
              echo "::error::inputs.version must be a semantic version such as 0.1.0 or 1.2.3-rc.1"
              exit 1
            fi
            svc="$svc,docker.io/pipestreamai/grpc-lol-html:$VERSION"
            ui="$ui,docker.io/pipestreamai/grpc-lol-html-ui:$VERSION"
          fi
          echo "svc=$svc" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
      - name: Build and push the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.svc }}
      - name: Build and push the viewer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demos/node-client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.ui }}

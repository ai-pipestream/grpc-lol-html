name: Rust

on: [ push, pull_request ]

jobs:
  rust:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        toolchain:
          - "1.88"  # MSRV, set by tonic 0.14 rather than by lol-html (1.85). Installed with rustup.
          - stable  # The hardened image's own toolchain, rustfmt and clippy.
          - beta    # Installed with rustup.
    steps:
    # The hardened image ships the Rust toolchain and a C linker only. The
    # actions need git and node, and rustup-managed toolchains need curl.
    - name: Install job tooling
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git nodejs
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      if: ${{ matrix.toolchain != 'stable' }}
      uses: dtolnay/rust-toolchain@master
      with:
          toolchain: ${{ matrix.toolchain }}
    - name: Toolchain version
      run: |
        cargo -vV
        rustc -vV
    - name: Build
      run: |
        cargo build
    - name: Run tests
      run: |
        cargo test
    - name: Format checks
      if: ${{ matrix.toolchain == 'stable' }}
      run: |
        cargo fmt -- --check
    - name: Clippy checks
      if: ${{ matrix.toolchain == 'stable' }}
      run: |
        cargo clippy --all-targets --all-features -- -Dwarnings

  proto:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
    # The hardened image ships the Rust toolchain and a C linker only. The
    # actions need git and node, and rustup-managed toolchains need curl.
    - name: Install job tooling
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git nodejs
    # Full history: `buf breaking` compares against origin/master.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # A checksummed release download behaves the same on GitHub and Forgejo.
    - name: Install buf
      env:
        BUF_VERSION: 1.71.0
      run: |
        base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
        bin="buf-Linux-$(uname -m)"
        cd "$RUNNER_TEMP"
        curl -sSfLO "$base/$bin"
        curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
        install -m 0755 "$bin" /usr/local/bin/buf
        buf --version
    - name: Lint the protobuf contract
      run: |
        buf lint
        buf build
    - name: Breaking changes against master
      run: |
        buf breaking --against '.git#branch=origin/master'
    # The generated Rust under src/gen is checked in (there is no build.rs),
    # so CI proves it still matches the proto rather than trusting a human to
    # have regenerated it. The plugin versions are pinned because a different
    # plugin produces a different file for the same proto.
    - name: Install codegen plugins
      run: |
        cargo install protoc-gen-prost --version 0.5.0 --locked
        cargo install protoc-gen-tonic --version 0.5.0 --locked
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
    - name: Checked-in codegen is fresh
      run: |
        buf generate
        buf build -o src/gen/file_descriptor_set.binpb
        git diff --exit-code src/gen/
